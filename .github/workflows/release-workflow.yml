name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Reject paid Anaconda channels
        shell: bash
        run: |
          if grep -rnE 'repo\.anaconda\.com|conda\.anaconda\.org/(main|r|msys2|anaconda)([^A-Za-z0-9_-]|$)|anaconda\.org/anaconda([^A-Za-z0-9_-]|$)|pkgs/(main|r|msys2)([^A-Za-z0-9_-]|$)|continuumio/(mini)?conda|Miniconda3-|Anaconda3-|channels\s*=\s*\[[^]]*["'"'"'](defaults|main|r|msys2)["'"'"']|channel\s*=\s*["'"'"'](defaults|main|r|msys2)["'"'"']|(-c|--channel)\s+(defaults|main|r|msys2)\b' \
              --include='*.toml' --include='*.lock' --include='*.yaml' --include='*.yml' \
              --exclude='release-workflow.yml' .; then
            echo "Paid Anaconda channel found. Use conda-forge or prefix.dev." >&2
            exit 1
          fi

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.76.2

      - run: pixi run build

      - name: Upload to prefix.dev
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          shopt -s globstar nullglob
          for pkg in output/**/*.conda; do
            pixi run rattler-build upload prefix -c instawork/instawork-packages --skip-existing "$pkg"
          done
